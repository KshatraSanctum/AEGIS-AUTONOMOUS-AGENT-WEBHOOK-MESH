zerops:
  - setup: ingress
    build:
      base: go@1.22
      buildCommands:
        - go build -o bin/ingress ./cmd/ingress
      deployFiles:
        - bin/ingress
    run:
      os: ubuntu
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        PORT: "8080"
        DATABASE_URL: ${db_connectionString}
        REDIS_HOST: ${cache_hostname}
        REDIS_PORT: ${cache_port}
        NATS_HOST: ${nats_hostname}
        NATS_USER: ${nats_user}
        NATS_PASSWORD: ${nats_password}
        HMAC_SECRET_KEY: "aegis_production_secret_key_2026_XYZ"
        ADMIN_TOKEN: "aegis-enterprise-admin-778899"
      start: ./bin/ingress

  - setup: worker
    build:
      base: go@1.22
      buildCommands:
        - go build -o bin/worker ./cmd/worker
      deployFiles:
        - bin/worker
    run:
      os: ubuntu
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_HOST: ${cache_hostname}
        REDIS_PORT: ${cache_port}
        NATS_HOST: ${nats_hostname}
        NATS_USER: ${nats_user}
        NATS_PASSWORD: ${nats_password}
        HMAC_SECRET_KEY: "aegis_production_secret_key_2026_XYZ"
        ADMIN_TOKEN: "aegis-enterprise-admin-778899"
      start: ./bin/worker