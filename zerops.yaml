zerops:
  - setup: ingress
    build:
      base: go@1.22
      buildCommands:
        - go build -o bin/ingress ./cmd/ingress
      deployFiles:
        - bin/ingress
    run:
      os: ubuntu
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        PORT: "8080"
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: "cache:6379"
        NATS_URL: "nats://nats:4222"
        HMAC_SECRET_KEY: "aegis_production_secret_key_2026_XYZ"
        ADMIN_TOKEN: "aegis-enterprise-admin-778899"
      start: ./bin/ingress

  - setup: worker
    build:
      base: go@1.22
      buildCommands:
        - go build -o bin/worker ./cmd/worker
      deployFiles:
        - bin/worker
    run:
      os: ubuntu
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: "cache:6379"
        NATS_URL: "nats://nats:4222"
        HMAC_SECRET_KEY: "aegis_production_secret_key_2026_XYZ"
        ADMIN_TOKEN: "aegis-enterprise-admin-778899"
      start: ./bin/worker